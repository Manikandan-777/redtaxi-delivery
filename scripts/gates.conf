# RedTaxi gate commands.  Format:  <phase>|<shell command>
# Every command must exit 0 for the gate to pass. Edit package names/commands to match your repo.
# Manual (M-) checks are NOT here: they live in signoff/phase-N.md and gate.sh requires every box ticked.
# Phase N's run also re-runs phases 0..N-1 (regression) unless you pass --no-regress.
#
# Windows / Git Bash notes (DEC environment):
#   Run gate via: "C:\Program Files\Git\bin\bash.exe" scripts/gate.sh <N>
#   Tools that require Linux/Docker (semgrep, trivy, zap, k6) are noted below.
#   gitleaks: install via `winget install gitleaks` (binary available for Windows).

# ---- Phase 0: decisions + workspace ----------------------------------------
0|test -f docs/DECISIONS.md
0|! grep -q "PROPOSED" docs/DECISIONS.md
0|pnpm install --frozen-lockfile
0|pnpm -r --if-present lint
0|pnpm -r --if-present typecheck
0|pnpm --filter @redtaxi/web test -- env
0|gitleaks detect --source . --redact

# ---- Phase 1: shared core + contract ----------------------------------------
1|pnpm --filter @redtaxi/shared test --coverage
1|pnpm --filter @redtaxi/mock-api test
1|pnpm contract:lint
1|pnpm contract:test
1|pnpm --filter @redtaxi/web build
1|pnpm --filter @redtaxi/mobile typecheck

# ---- Phase 2: design system + shells ----------------------------------------
2|pnpm --filter @redtaxi/web test -- components
2|pnpm --filter @redtaxi/mobile test -- components
2|pnpm --filter @redtaxi/web test:a11y
2|pnpm --filter @redtaxi/web test:e2e -- layouts
2|pnpm --filter @redtaxi/web build

# ---- Phase 3: auth + roles --------------------------------------------------
3|pnpm --filter @redtaxi/web test -- auth
3|pnpm --filter @redtaxi/mobile test -- auth
3|pnpm --filter @redtaxi/web test:e2e -- auth
3|bash scripts/security-smoke.sh

# ---- Phase 4: passenger booking + payment -----------------------------------
4|pnpm --filter @redtaxi/web test -- booking
4|pnpm --filter @redtaxi/mobile test -- passenger
4|pnpm --filter @redtaxi/web test:e2e -- passenger-booking
4|pnpm --filter @redtaxi/web lighthouse
4|pnpm --filter @redtaxi/mobile e2e -- passenger-booking

# ---- Phase 5: live tracking + completion ------------------------------------
5|pnpm --filter @redtaxi/web test -- tracking
5|pnpm --filter @redtaxi/mobile test -- tracking
5|pnpm --filter @redtaxi/web test:e2e -- tracking
5|pnpm --filter @redtaxi/mobile e2e -- tracking

# ---- Phase 6: driver --------------------------------------------------------
6|pnpm --filter @redtaxi/web test -- driver
6|pnpm --filter @redtaxi/mobile test -- driver
6|pnpm --filter @redtaxi/web test:e2e -- driver
6|pnpm --filter @redtaxi/mobile e2e -- driver

# ---- Phase 7: admin + DEMO security run + quick scans ----------------------
7|pnpm --filter @redtaxi/web test -- admin
7|pnpm --filter @redtaxi/mobile test -- admin
7|pnpm --filter @redtaxi/web test:e2e -- admin
7|pnpm --filter @redtaxi/mobile e2e -- admin
7|bash scripts/security-smoke.sh
7|pnpm audit --prod --audit-level=high
# WINDOWS NOTE: semgrep runs in CI (security.yml) not locally; gate reads CI status file instead:
7|test -f docs/semgrep-phase-7.pass
# Demo Security Run (SECURITY_CHECK.md, items tagged D) recorded in docs/SECURITY_RUN_LOG.md:
7|grep -q "^Run: Demo" docs/SECURITY_RUN_LOG.md && ! grep -qE "\| *FAIL *\|" docs/SECURITY_RUN_LOG.md

# ---- Phase 8: real backend --------------------------------------------------
8|pnpm contract:test:staging
8|pnpm --filter @redtaxi/web test:e2e:staging
8|pnpm --filter @redtaxi/mobile e2e:staging
# WINDOWS NOTE: k6 runs in CI; use `k6 run perf/load.js` directly if k6 is installed
8|k6 run perf/load.js
8|k6 run perf/sockets.js

# ---- Phase 9: hardening -----------------------------------------------------
9|bash scripts/security-smoke.sh
9|pnpm audit --prod --audit-level=high
# WINDOWS NOTE: trivy + ZAP run in Docker or CI; gate reads their result files:
9|test -f docs/trivy-phase-9.pass
9|test -f docs/zap-phase-9.pass
9|pnpm --filter @redtaxi/web test:a11y:all
9|pnpm --filter @redtaxi/web lighthouse
9|! grep -E "\|\s*(Critical|High)\s*\|\s*(Open|In progress)" docs/VULN_REGISTER.md
9|grep -q "^Run: Full" docs/SECURITY_RUN_LOG.md && ! grep -qE "\| *FAIL *\|" docs/SECURITY_RUN_LOG.md

# ---- Phase 10: release ------------------------------------------------------
10|pnpm --filter @redtaxi/web build
10|pnpm smoke:staging
10|WEB="$PROD_URL" bash scripts/security-smoke.sh
