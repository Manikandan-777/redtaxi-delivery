openapi: 3.1.0
info:
  title: RedTaxi Unified API
  description: Unified API contract for RedTaxi Pollachi (Next.js web + Expo mobile). All money amounts are in integer paise.
  version: 1.0.0
  contact:
    name: RedTaxi Engineering
    email: engineering@redtaxi.internal

servers:
  - url: http://localhost:4000
    description: Mock API Server (services/mock-api)

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/otp/send:
    post:
      summary: Send OTP for login
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^[6-9]\d{9}$'
                role:
                  type: string
                  enum: [passenger, driver]
                  default: passenger
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  resendAfterSec: { type: integer, example: 30 }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /auth/otp/verify:
    post:
      summary: Verify OTP and exchange for session
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  pattern: '^[6-9]\d{9}$'
                otp:
                  type: string
                  pattern: '^\d{6}$'
                role:
                  type: string
                  enum: [passenger, driver]
      responses:
        "200":
          description: Verification success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      phone: { type: string }
                      role: { type: string }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/admin/login:
    post:
      summary: Admin email/password login
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        "200":
          description: Admin credentials valid, returns session or requires MFA
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaRequired: { type: boolean }
                  token: { type: string }
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/admin/mfa:
    post:
      summary: Admin TOTP MFA verification
      operationId: adminMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, totpCode]
              properties:
                email: { type: string, format: email }
                totpCode: { type: string, pattern: '^\d{6}$' }
      responses:
        "200":
          description: MFA passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/refresh:
    post:
      summary: Refresh authentication session
      operationId: refreshAuth
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/logout:
    post:
      summary: Terminate session
      operationId: logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  # ── Catalog & Places ──────────────────────────────────────────────────────
  /vehicles:
    get:
      summary: List available vehicles
      operationId: listVehicles
      parameters:
        - in: query
          name: pickup
          schema: { type: string }
        - in: query
          name: drop
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [one_way, round_trip, local] }
      responses:
        "200":
          description: Vehicle fleet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /tariff:
    get:
      summary: Get current base tariff rules
      operationId: getTariff
      responses:
        "200":
          description: Active tariff rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingRule"

  /places/autocomplete:
    get:
      summary: Search places with autocomplete
      operationId: autocompletePlaces
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"

  /places/details:
    get:
      summary: Get place coordinates by ID
      operationId: getPlaceDetails
      parameters:
        - in: query
          name: placeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"

  /places/reverse:
    get:
      summary: Reverse geocode lat/lng to place
      operationId: reverseGeocode
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Reverse geocoded place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"

  /directions:
    get:
      summary: Compute route distance, duration and polyline
      operationId: getDirections
      parameters:
        - in: query
          name: originLat
          required: true
          schema: { type: number }
        - in: query
          name: originLng
          required: true
          schema: { type: number }
        - in: query
          name: destLat
          required: true
          schema: { type: number }
        - in: query
          name: destLng
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Directions route
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceKm: { type: number }
                  durationMin: { type: number }
                  polyline: { type: string }

  # ── Quotes & Bookings ─────────────────────────────────────────────────────
  /quotes:
    post:
      summary: Generate a server-computed fare quote (valid for 15 minutes)
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, drop, vehicleClass, mode]
              properties:
                pickup: { $ref: "#/components/schemas/Place" }
                drop: { $ref: "#/components/schemas/Place" }
                vehicleClass: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
                mode: { type: string, enum: [one_way, round_trip, local] }
      responses:
        "200":
          description: Fare quote computed by server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareQuote"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /quotes/{id}:
    get:
      summary: Fetch quote by ID
      operationId: getQuote
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fare quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FareQuote"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /payments/orders:
    post:
      summary: Create Razorpay payment order
      operationId: createPaymentOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, paymentOption]
              properties:
                quoteId: { type: string }
                paymentOption: { type: string, enum: [deposit, full] }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  amount: { type: integer, description: Amount in paise }
                  currency: { type: string, example: INR }
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /payments/verify:
    post:
      summary: Verify payment signature and confirm booking
      operationId: verifyPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, paymentId, signature, quoteId]
              properties:
                orderId: { type: string }
                paymentId: { type: string }
                signature: { type: string }
                quoteId: { type: string }
      responses:
        "200":
          description: Payment verified, booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId: { type: string }
                  bookingCode: { type: string }
                  status: { type: string, example: searching }
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /webhooks/razorpay:
    post:
      summary: Server-to-server Razorpay webhook
      operationId: razorpayWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Webhook received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }

  /bookings:
    post:
      summary: Create booking (pay at pickup or confirmed with order)
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, paymentOption]
              properties:
                quoteId: { type: string }
                paymentOption: { type: string, enum: [deposit, full] }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    get:
      summary: List bookings for authenticated customer/driver/admin
      operationId: listBookings
      responses:
        "200":
          description: Booking list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      summary: Get booking details
      operationId: getBooking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Booking entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /bookings/{id}/cancel:
    post:
      summary: Cancel a booking with reason
      operationId: cancelBooking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/rating:
    post:
      summary: Rate completed trip
      operationId: submitRating
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Rating accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /bookings/{id}/sos:
    post:
      summary: Trigger emergency SOS alert
      operationId: triggerSos
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SOS acknowledged and dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
                  timestamp: { type: string }

  /bookings/{id}/share:
    post:
      summary: Generate tokenized public ride tracking link
      operationId: shareBooking
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public share token
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareToken: { type: string }
                  publicUrl: { type: string }

  /public/track/{token}:
    get:
      summary: Public unauthenticated ride tracking view
      operationId: getPublicTracking
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public tracking summary (no PII)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingCode: { type: string }
                  status: { type: string }
                  pickupLabel: { type: string }
                  dropLabel: { type: string }
                  driverName: { type: string }
                  vehicleNo: { type: string }
                  driverLat: { type: number }
                  driverLng: { type: number }

  # ── Driver Experience ─────────────────────────────────────────────────────
  /driver/online:
    post:
      summary: Toggle driver online/offline availability
      operationId: setDriverOnline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: { type: boolean }
        "403":
          description: Blocked if driver documents unverified or expired
          $ref: "#/components/responses/ErrorResponse"

  /driver/stats:
    get:
      summary: Get driver today statistics
      operationId: getDriverStats
      responses:
        "200":
          description: Driver dashboard stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  todayEarnings: { type: integer, description: In paise }
                  tripsCompleted: { type: integer }
                  hoursOnline: { type: number }

  /driver/offers/{id}:
    get:
      summary: Fetch incoming offer details with countdown
      operationId: getDriverOffer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Offer entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  bookingId: { type: string }
                  expiresAt: { type: string }
                  pickup: { $ref: "#/components/schemas/Place" }
                  drop: { $ref: "#/components/schemas/Place" }
                  fare: { type: integer, description: In paise }

  /offers/{id}/accept:
    post:
      summary: Accept incoming ride offer
      operationId: acceptOffer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Offer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Trip no longer available (accepted by someone else)
          $ref: "#/components/responses/ErrorResponse"

  /offers/{id}/decline:
    post:
      summary: Decline incoming ride offer
      operationId: declineOffer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Offer declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  declined: { type: boolean }

  /bookings/{id}/arrived:
    post:
      summary: Driver marks arrival at pickup
      operationId: markDriverArrived
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status updated to driver_arrived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/start:
    post:
      summary: Start trip by verifying 4-digit ride OTP
      operationId: startTrip
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, pattern: '^\d{4}$' }
      responses:
        "200":
          description: Status updated to in_progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid OTP or attempt limit exceeded
          $ref: "#/components/responses/ErrorResponse"

  /bookings/{id}/complete:
    post:
      summary: Complete trip and record odometer
      operationId: completeTrip
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [odometer]
              properties:
                odometer: { type: number }
      responses:
        "200":
          description: Trip completed. Returns amount to collect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: "#/components/schemas/Booking" }
                  amountToCollect: { type: integer, description: In paise }

  /driver/earnings:
    get:
      summary: Get driver earnings report
      operationId: getDriverEarnings
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Earnings report
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalEarnings: { type: integer }
                  tripsCount: { type: integer }
                  onlineHours: { type: number }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        amount: { type: integer }

  /driver/profile:
    get:
      summary: Get driver profile & bank details (masked)
      operationId: getDriverProfile
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  phone: { type: string }
                  vehicleNo: { type: string }
                  vehicleClass: { type: string }
                  bankAccountNumberMasked: { type: string }
    put:
      summary: Update driver profile (explicit allowlist fields)
      operationId: updateDriverProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /driver/documents:
    post:
      summary: Upload driver documents (license, RC, insurance)
      operationId: uploadDriverDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType: { type: string, enum: [license, rc, insurance] }
                file: { type: string, format: binary }
      responses:
        "200":
          description: Document uploaded for verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, approved, rejected] }

  # ── Admin Operations ──────────────────────────────────────────────────────
  /admin/stats:
    get:
      summary: Admin dashboard metric tiles (DEC-6)
      operationId: getAdminStats
      responses:
        "200":
          description: Real operational metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBookingsToday: { type: integer }
                  activeRides: { type: integer }
                  driversOnline: { type: integer }
                  pendingDrivers: { type: integer }
                  completedToday: { type: integer }

  /admin/drivers:
    get:
      summary: List drivers with server-side pagination & filtering
      operationId: listAdminDrivers
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Drivers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DriverRow" }
                  total: { type: integer }

  /admin/drivers/{id}:
    get:
      summary: Driver verification details
      operationId: getAdminDriverDetail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Driver details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRow"

  /admin/drivers/{id}/approve:
    post:
      summary: Approve driver after document verification
      operationId: approveDriver
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Driver approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/drivers/{id}/reject:
    post:
      summary: Reject driver registration with mandatory reason
      operationId: rejectDriver
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Driver rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/bookings:
    get:
      summary: List bookings for admin
      operationId: listAdminBookings
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      summary: Create booking via phone dispatch form
      operationId: adminCreateBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerPhone, customerName, pickup, drop, vehicleClass]
              properties:
                customerPhone: { type: string }
                customerName: { type: string }
                pickup: { $ref: "#/components/schemas/Place" }
                drop: { $ref: "#/components/schemas/Place" }
                vehicleClass: { type: string }
      responses:
        "200":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /admin/bookings/{id}:
    get:
      summary: Get admin booking details and timeline
      operationId: getAdminBookingDetail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detailed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /admin/bookings/{id}/assign:
    post:
      summary: Manually dispatch/assign driver to booking
      operationId: adminAssignDriver
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId]
              properties:
                driverId: { type: string }
      responses:
        "200":
          description: Driver assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /admin/dispatch:
    get:
      summary: Live dispatch map data (unassigned rides + available drivers)
      operationId: getLiveDispatch
      responses:
        "200":
          description: Live dispatch data
          content:
            application/json:
              schema:
                type: object
                properties:
                  unassignedBookings:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  nearbyDrivers:
                    type: array
                    items: { $ref: "#/components/schemas/DriverRow" }

  /admin/pricing/{class}:
    get:
      summary: Get pricing rule for vehicle class
      operationId: getAdminPricing
      parameters:
        - in: path
          name: class
          required: true
          schema: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
      responses:
        "200":
          description: Pricing rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
    put:
      summary: Update pricing rule for vehicle class (affects new quotes only)
      operationId: updateAdminPricing
      parameters:
        - in: path
          name: class
          required: true
          schema: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRule"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /admin/tickets:
    get:
      summary: List support tickets
      operationId: listAdminTickets
      responses:
        "200":
          description: Tickets list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ticket" }

  /admin/tickets/{id}:
    get:
      summary: Get ticket details and conversation thread
      operationId: getAdminTicket
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ticket entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /admin/analytics:
    get:
      summary: System analytics metrics (DEC-7 completion rate)
      operationId: getAdminAnalytics
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [today, week, month] }
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBookings: { type: integer, example: 342 }
                  completedBookings: { type: integer, example: 310 }
                  cancelledBookings: { type: integer, example: 22 }
                  completionRate: { type: number, example: 90.6 }
                  totalRevenue: { type: integer, description: In paise, example: 24850000 }

  /admin/audit:
    get:
      summary: Read-only append-only audit trail
      operationId: getAdminAudit
      responses:
        "200":
          description: Audit logs list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    actorId: { type: string }
                    action: { type: string }
                    target: { type: string }
                    timestamp: { type: string }

components:
  schemas:
    Place:
      type: object
      required: [label, lat, lng]
      properties:
        label: { type: string }
        sublabel: { type: string }
        lat: { type: number }
        lng: { type: number }
        placeId: { type: string }

    Vehicle:
      type: object
      required: [id, class, displayName, passengers, bags, ratePerKm, minKm, imageUrl]
      properties:
        id: { type: string }
        class: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
        displayName: { type: string }
        passengers: { type: integer }
        bags: { type: integer }
        ratePerKm: { type: integer, description: Rate in integer paise }
        minKm: { type: integer }
        imageUrl: { type: string }
        popular: { type: boolean }

    FareLine:
      type: object
      required: [key, label, amount]
      properties:
        key: { type: string, enum: [distance, batta, toll, night, gst] }
        label: { type: string }
        amount: { type: integer, description: Line amount in integer paise }

    DepositOption:
      type: object
      required: [type, payNow, payAtDrop]
      properties:
        type: { type: string, enum: [deposit, full] }
        payNow: { type: integer, description: Amount to pay now in paise }
        payAtDrop: { type: integer, description: Amount to pay at drop in paise }
        recommended: { type: boolean }

    FareQuote:
      type: object
      required:
        [id, vehicleId, mode, distanceKm, durationMin, lines, total, depositOptions, validUntil]
      properties:
        id: { type: string }
        vehicleId: { type: string }
        mode: { type: string, enum: [one_way, round_trip, local] }
        distanceKm: { type: number }
        durationMin: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/FareLine" }
        total: { type: integer, description: Total amount in integer paise }
        depositOptions:
          type: array
          items: { $ref: "#/components/schemas/DepositOption" }
        validUntil: { type: string, format: date-time }

    Booking:
      type: object
      required: [id, code, customer, pickup, drop, startsAt, status, quote, paid, due, timeline]
      properties:
        id: { type: string }
        code: { type: string, example: BK10234 }
        customer:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
        pickup: { $ref: "#/components/schemas/Place" }
        drop: { $ref: "#/components/schemas/Place" }
        startsAt: { type: string, format: date-time }
        status:
          type: string
          enum:
            [
              created,
              scheduled,
              searching,
              driver_assigned,
              driver_arriving,
              driver_arrived,
              in_progress,
              completed,
              cancelled,
              no_driver,
            ]
        quote: { $ref: "#/components/schemas/FareQuote" }
        driver:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
            rating: { type: number }
            vehicleNo: { type: string }
            vehicleClass: { type: string }
        startOtp: { type: string, description: 4-digit ride OTP }
        paid: { type: integer }
        due: { type: integer }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              at: { type: string, format: date-time }

    DriverRow:
      type: object
      required: [id, name, vehicleNo, vehicleClass, status, rating, online]
      properties:
        id: { type: string }
        name: { type: string }
        vehicleNo: { type: string }
        vehicleClass: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
        status: { type: string, enum: [pending, approved, rejected] }
        rating: { type: number }
        online: { type: boolean }

    PricingRule:
      type: object
      required:
        [
          vehicleClass,
          baseRatePerKm,
          dailyBatta,
          nightAllowance,
          minOutstationKm,
          advanceDepositPercent,
          minDeposit,
        ]
      properties:
        vehicleClass: { type: string, enum: [hatchback, sedan, suv, innova, tempo] }
        baseRatePerKm: { type: integer, description: Rate in paise }
        dailyBatta: { type: integer, description: Batta in paise }
        nightAllowance: { type: integer, description: Night in paise }
        minOutstationKm: { type: integer }
        advanceDepositPercent: { type: integer }
        minDeposit: { type: integer, description: Min deposit in paise }

    Ticket:
      type: object
      required: [id, code, title, reporter, priority, status, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        reporter: { type: string, enum: [customer, driver] }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: string, format: date-time }

  responses:
    ErrorResponse:
      description: API error envelope
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              fields:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
